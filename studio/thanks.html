  <title>Danke · Marharian Production</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f5f0eb;
      --charcoal: #1a1815;
      --gold: #c9a96e;
      --gold-light: #e2c89a;
      --gray: #888580;
      --font-heading: 'Playfair Display', serif;
      --font-body: 'DM Sans', sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 520px; }
    .eyebrow {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }
    h1 {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.15;
      margin-bottom: 20px;
    }
    p {
      font-size: 17px;
      font-weight: 300;
      color: var(--gray);
      line-height: 1.7;
      margin-bottom: 36px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: var(--gold);
      color: var(--charcoal);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.22s;
    }
    a.btn:hover { background: var(--gold-light); transform: translateY(-2px); }
  </style>
</head>
