<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You · Marharian Production</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --charcoal: #1a1815;
      --gold: #c9a96e;
      --font-heading: 'Playfair Display', serif;
      --font-body: 'DM Sans', sans-serif;
    }
    html, body {
      height: 100%;
      background: var(--charcoal);
      font-family: var(--font-body);
      color: #ffffff;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }
    .logo img {
      height: 48px;
      width: auto;
      margin-bottom: 48px;
      filter: brightness(0) invert(1);
    }
    h1 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      line-height: 1.2;
      margin-bottom: 16px;
    }
    h1 em {
      font-style: italic;
      color: var(--gold);
    }
    p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .btn {
      display: inline-block;
      padding: 16px 40px;
      border: 2px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover {
      background: var(--gold);
      color: var(--charcoal);
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="marharian.png" alt="Marharian Production">
  </div>
  <h1>Thank <em>you!</em></h1>
  <p>We'll get back to you within 24 hours.</p>
  <a href="https://marharian.com" class="btn">Back to Home</a>
</body>
</html>
